services:
  db:
    image: postgres:16-alpine
    container_name: shortly_db_prod
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - shortly_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shortly}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shortly_web_prod
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
    networks:
      - shortly_internal
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shortly.rule=Host(`${DOMAIN}`)"
      - "traefik.http.services.shortly.loadbalancer.server.port=3000"
    depends_on:
      db:
        condition: service_healthy

networks:
  shortly_internal:
    driver: bridge
  traefik_net:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_default}

volumes:
  postgres_prod_data:
